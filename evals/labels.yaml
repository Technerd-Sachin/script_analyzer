        - {target: ta, type: on_screen_text, contains: "He locked the car doors"}
        - {target: hi, type: on_screen_text, contains: "NO ENTRY AFTER 10 PM"}
        - {target: ta, type: on_screen_text, contains: "NO ENTRY AFTER 10 PM"}
