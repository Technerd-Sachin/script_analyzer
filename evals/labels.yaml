      localization:
        - {target: ta, type: idiom_wordplay, contains: "Ulta chor kotwal ko daante"}
        - {target: te, type: idiom_wordplay, contains: "Ulta chor kotwal ko daante"}
        - {target: ta, type: on_screen_text, contains: "Ek ghante mein Rathore farmhouse"}
        - {target: te, type: on_screen_text, contains: "Ek ghante mein Rathore farmhouse"}
      originality: false

  - id: s06_hindi_devanagari
