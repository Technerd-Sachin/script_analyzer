# Eval labels for evals/scripts.
# All "contains" / "cliffhanger_contains" values are verbatim substrings of the script file.
# For dialogue, the speaker cue is part of the rendered line ("RIA: You're lying."), so
# continuity "contains" values may match the speaker cue rather than the dialogue text.
#
# Keys under expect (all optional except group and cliffhanger_contains):
#   group                  strong | weak | neutral (ranking: every strong > every weak)
#   cliffhanger_contains   substring of the expected cliffhanger line
#   factor_low / factor_high   factors expected to score <= 2 / >= 4
#   rating_band            expected exact band; rating_band_any = acceptable bands
#   severity_any           {category: [acceptable severities]} for rating findings
#   notices                expected statutory notices ([] means none)
#   continuity             planted issues: type + substrings found in the involved lines
#   localization           planted issues per target language (localization issue type)
#   fit_max                expected maximum fit score per target
#   on_screen_text_min     minimum number of on_screen_text localization issues per target
#   weakest_ending_episode episode whose ending hook is planted as the weakest
#   injection_canary       string that must not appear anywhere in the report
#   originality            expected originality_flag (market suite)
#   alternatives_win       at least one alternative must win
version: 1
scripts:
  - id: s01_last_message
    file: evals/scripts/s01_last_message.txt
    language: en
    episodes: 1
    pages_approx: 0.2
    suites: [core, rating, scanned]
    expect:
      group: neutral
      cliffhanger_contains: "accident wasn't your fault"
      rating_band_any: ["U", "U/A 7+"]
      notices: []

  - id: s02_strong_three_episodes
    file: evals/scripts/s02_strong_three_episodes.txt
    language: en
    episodes: 3
    pages_approx: 3.5
    suites: [core, alternatives, market]
    expect:
      group: strong
      cliffhanger_contains: "That girl is not Kiara"
      factor_high: [opening_hook, cliffhanger_pull]
      originality: false

  - id: s03_weak_flat
    file: evals/scripts/s03_weak_flat.txt
    language: en
    episodes: 1
    pages_approx: 1.8
    suites: [core, alternatives]
    expect:
      group: weak
      cliffhanger_contains: "I applied for this job too"
      factor_low: [opening_hook, cliffhanger_pull, dialogue_quality]
      alternatives_win: true

  - id: s04_weak_ending
    file: evals/scripts/s04_weak_ending.txt
    language: en
    episodes: 1
    pages_approx: 1.7
    suites: [core]
    expect:
      group: weak
      cliffhanger_contains: "they'll come to the store"
      factor_low: [cliffhanger_pull]

  - id: s05_hinglish_revenge
    file: evals/scripts/s05_hinglish_revenge.txt
    language: hi-Latn
    episodes: 5
    pages_approx: 7.5
    suites: [core, rating, localization, market, scanned]
    expect:
      group: strong
