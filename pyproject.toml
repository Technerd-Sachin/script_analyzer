[project]
name = "bullet-script-analyzer"
version = "0.1.0"
description = "Open-source AI analysis of short micro-drama scripts: story, emotion, engagement, improvements, alternatives, age rating, localization and market fit."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "langgraph>=0.2",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "streamlit>=1.40",
    "plotly>=5.24",
    "rapidfuzz>=3.10",
    "structlog>=24.4",
    "typer>=0.13",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "pillow>=10.4",
    "qdrant-client>=1.12",
    "fastembed>=0.4",
]

[project.optional-dependencies]
# Local PaddleOCR for Devanagari pages (GPU build, CUDA 12.6). Latin pages use the DOC_QnA PaddleOCR service.
ocr = ["paddlepaddle-gpu==3.3.1", "paddleocr==3.6.0"]

[project.scripts]
bsa = "bsa.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "pyright>=1.1.390",
    "reportlab>=4.2",
]

[[tool.uv.index]]
name = "paddle-cu126"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu126" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bsa"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "ui", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
extraPaths = ["."]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingTypeArgument = false
reportUntypedFunctionDecorator = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
